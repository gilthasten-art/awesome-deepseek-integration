[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-strategic-dossier-engine"
version = "0.1.0"
description = "Production-grade strategic dossier generation system with compliance and SBA outputs"
readme = "README_SovereignStrategicDossierEngine.md"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1.2",
  "reportlab>=4.2.2"
]

[project.scripts]
sovereign-dossier = "sovereign_strategic_dossier_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
